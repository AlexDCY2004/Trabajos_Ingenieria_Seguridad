# Entorno de DESARROLLO. Los secretos de este archivo son de prueba: en producción vienen del gestor
# de secretos (KMS) y el backend no arranca con NODE_ENV=production si faltan (config/cifrado.ts).
# Los puertos de base de datos, Redis y pgAdmin solo escuchan en 127.0.0.1 (R17: sin exposición externa).

services:
  postgres:
    image: postgres:16-alpine
    container_name: citas_postgres
    environment:
      POSTGRES_DB: citas_db
      # Dueño de las tablas (superusuario): solo para migraciones y datos de prueba, nunca para la API
      POSTGRES_USER: citas_app
      POSTGRES_PASSWORD: citas_pass_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - citas_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citas_app -d citas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: citas_redis
    command: ["redis-server", "--requirepass", "redis_pass_dev", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - citas_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass_dev", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: citas_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@citas.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin_pass_dev
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - citas_net

  # Buzón de correo de desarrollo: captura los códigos, recordatorios y avisos que envía el backend.
  # Ver en http://localhost:8025. En producción se usa el SMTP del proveedor de mensajería.
  mailpit:
    image: axllent/mailpit:latest
    container_name: citas_mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - citas_net

  backend:
    build: ./backend
    container_name: citas_backend
    environment:
      # Rol sin superusuario ni BYPASSRLS: PostgreSQL aplica RLS (database/05_rol_aplicacion.sql)
      DATABASE_URL: postgresql://portal_app:portal_app_dev_change_me@postgres:5432/citas_db
      # Solo para `npm run seed` (datos de prueba). La API no la usa.
      SEED_DATABASE_URL: postgresql://citas_app:citas_pass_dev@postgres:5432/citas_db
      REDIS_URL: redis://:redis_pass_dev@redis:6379
      JWT_SECRET: supersecret_jwt_dev_change_in_prod
      JWT_REFRESH_SECRET: supersecret_refresh_dev_change_in_prod
      # Cifrado por campo de la póliza. Cambiarla deja ilegibles las pólizas ya cifradas.
      POLIZA_KEY: dev_poliza_key_change_me
      # Cifrado del secreto TOTP del segundo factor
      MFA_KEY: dev_mfa_key_change_me_2026
      # HMAC de la identificación. Cambiarlo invalida la detección de cédulas repetidas ya registradas.
      HMAC_SECRET: dev_hmac_secret_change_me
      # Firma de los webhooks de la pasarela de pagos
      WEBHOOK_SECRET: dev_webhook_secret_change_me_2026
      # Cifrado de los documentos de representación de dependientes
      DOCUMENTOS_KEY: dev_documentos_key_change_me_2026
      # Correo (Mailpit en desarrollo)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      CORREO_REMITENTE: Portal de Citas <no-responder@citas.local>
      URL_PORTAL: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      PORT: 4000
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - citas_net

  frontend:
    build: ./frontend
    container_name: citas_frontend
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - citas_net

volumes:
  postgres_data:
  redis_data:

networks:
  citas_net:
    driver: bridge
